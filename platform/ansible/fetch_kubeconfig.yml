---
- name: Fetch kubeconfig from first master
  hosts: CONTROLLERS[0]
  gather_facts: false
  become: true

  vars:
    rke2_kubeconfig_path: /etc/rancher/rke2/rke2.yaml
    k3s_kubeconfig_path: /etc/rancher/k3s/k3s.yaml

  tasks:
    - name: Select kubeconfig path
      ansible.builtin.set_fact:
        remote_kubeconfig_path: >-
          {{
            rke2_kubeconfig_path
            if cloud_init_selected == "rke2"
            else k3s_kubeconfig_path
          }}

    - name: Read kubeconfig from remote node
      ansible.builtin.slurp:
        src: "{{ remote_kubeconfig_path }}"
      register: kubeconfig_raw

    - name: Decode kubeconfig content
      ansible.builtin.set_fact:
        kubeconfig_content: "{{ kubeconfig_raw.content | b64decode }}"

    - name: Replace localhost API endpoint
      ansible.builtin.set_fact:
        kubeconfig_content_updated: >-
          {{
            kubeconfig_content
            | regex_replace(
                'server: https://127\.0\.0\.1:[0-9]+',
                'server: https://' ~ kube_api_endpoint ~ ':6443'
              )
          }}

    - name: Ensure local .kube directory exists
      ansible.builtin.file:
        path: "{{ lookup('env', 'HOME') }}/.kube"
        state: directory
        mode: '0700'
      delegate_to: localhost
      become: false

    - name: Write kubeconfig locally
      ansible.builtin.copy:
        content: "{{ kubeconfig_content_updated }}"
        dest: "{{ local_kubeconfig_path }}"
        mode: '0600'
      delegate_to: localhost
      become: false

    - name: Display kubeconfig location
      ansible.builtin.debug:
        msg: "Kubeconfig written to {{ local_kubeconfig_path }}"